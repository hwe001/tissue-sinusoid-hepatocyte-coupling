<!doctype html><meta charset="utf-8"><title>True 3-D Voronoi lobular tissue</title>
<style>body{margin:0;background:#101820;color:#e8eef2;font:14px system-ui,sans-serif;overflow:hidden}#info{position:fixed;z-index:2;top:12px;left:12px;padding:10px 12px;background:#182630dd;border-radius:6px}canvas{display:block}</style>
<div id="info"><b>Honeycomb-like 3-D Voronoi tissue</b><br>free polyhedral outer surface<br><small>blue: generators · gold: cell edges · drag rotate · wheel zoom</small></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js';
const s=new THREE.Scene();s.background=new THREE.Color(0x101820);const c=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(devicePixelRatio);r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);const o=new OrbitControls(c,r.domElement);s.add(new THREE.AmbientLight(0xffffff,1.6));
fetch('true_3d_voronoi.json').then(x=>x.json()).then(d=>{const group=new THREE.Group();d.cells.filter(cell=>Math.max(...cell.center.map(Math.abs))<1.1).forEach(cell=>{const pos=[];cell.faces.forEach(f=>{for(let k=1;k<f.length-1;k++)pos.push(...cell.vertices[f[0]],...cell.vertices[f[k]],...cell.vertices[f[k+1]])});const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.computeVertexNormals();group.add(new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0x4f8f9d,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false})));const ep=[];cell.faces.forEach(f=>{for(let k=0;k<f.length;k++)ep.push(...cell.vertices[f[k]],...cell.vertices[f[(k+1)%f.length]])});const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));group.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0xf0c36b,transparent:true,opacity:.7})));const dot=new THREE.Mesh(new THREE.SphereGeometry(.055,8,6),new THREE.MeshBasicMaterial({color:0x4fc3f7}));dot.position.set(...cell.center);group.add(dot);});s.add(group);const box=new THREE.Box3().setFromObject(group),m=box.getCenter(new THREE.Vector3()),z=box.getSize(new THREE.Vector3()).length();o.target.copy(m);c.position.copy(m).add(new THREE.Vector3(z*.9,z*.7,z*.9));c.near=.001;c.far=100;c.updateProjectionMatrix();o.update();});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});(function loop(){requestAnimationFrame(loop);r.render(s,c)})();
</script>
