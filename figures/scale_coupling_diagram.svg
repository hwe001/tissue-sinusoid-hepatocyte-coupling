<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<rect width="1600" height="720" fill="white"/>
<style>.box{fill:#f7fafc;stroke:#263746;stroke-width:3}.title{font:700 26px Arial;fill:#16232e}.txt{font:20px Arial;fill:#263746}.small{font:17px Arial;fill:#50606d}.arrow{stroke:#45677b;stroke-width:4;fill:none;marker-end:url(#head)}.back{stroke:#b65a3c;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#backhead)}</style>
<defs><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#45677b"/></marker><marker id="backhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b65a3c"/></marker></defs>
<text x="800" y="48" text-anchor="middle" class="title">Model-interoperable virtual hepatic tissue</text>
<rect x="45" y="130" width="250" height="190" rx="18" class="box"/><text x="170" y="175" text-anchor="middle" class="title">Tissue scale</text><text x="170" y="215" text-anchor="middle" class="txt">3-D Voronoi scaffold</text><text x="170" y="250" text-anchor="middle" class="small">128 virtual lobules</text><text x="170" y="278" text-anchor="middle" class="small">432 portal candidates</text><text x="170" y="306" text-anchor="middle" class="small">128 CV generators</text>
<rect x="345" y="130" width="250" height="190" rx="18" class="box"/><text x="470" y="175" text-anchor="middle" class="title">Lobule scale</text><text x="470" y="215" text-anchor="middle" class="txt">territory + adjacency</text><text x="470" y="250" text-anchor="middle" class="small">portal sites → CV</text><text x="470" y="278" text-anchor="middle" class="small">Delaunay connectivity</text><text x="470" y="306" text-anchor="middle" class="small">volume / faces / edges</text>
<rect x="645" y="130" width="250" height="190" rx="18" class="box"/><text x="770" y="175" text-anchor="middle" class="title">Sinusoid scale</text><text x="770" y="215" text-anchor="middle" class="txt">directed transport graph</text><text x="770" y="250" text-anchor="middle" class="small">512 paths</text><text x="770" y="278" text-anchor="middle" class="small">16 axial volumes/path</text><text x="770" y="306" text-anchor="middle" class="small">flow + residence time</text>
<rect x="945" y="130" width="250" height="190" rx="18" class="box"/><text x="1070" y="175" text-anchor="middle" class="title">Control-volume scale</text><text x="1070" y="215" text-anchor="middle" class="txt">local boundary state</text><text x="1070" y="250" text-anchor="middle" class="small">oxygen / substrates</text><text x="1070" y="278" text-anchor="middle" class="small">APAP / metabolites</text><text x="1070" y="306" text-anchor="middle" class="small">8,192 sites</text>
<rect x="1245" y="130" width="300" height="190" rx="18" class="box"/><text x="1395" y="175" text-anchor="middle" class="title">Cell-model scale</text><text x="1395" y="215" text-anchor="middle" class="txt">SBML / CellML</text><text x="1395" y="250" text-anchor="middle" class="small">APAP metabolism</text><text x="1395" y="278" text-anchor="middle" class="small">oxidative stress</text><text x="1395" y="306" text-anchor="middle" class="small">state + flux outputs</text>
<path d="M295 225 H340" class="arrow"/><path d="M595 225 H640" class="arrow"/><path d="M895 225 H940" class="arrow"/><path d="M1195 225 H1240" class="arrow"/>
<text x="800" y="390" text-anchor="middle" class="title">Forward coupling</text><text x="800" y="425" text-anchor="middle" class="small">topology → flow → local concentrations → model inputs</text>
<path d="M1395 350 C1395 545 205 545 205 350" class="back"/><text x="800" y="590" text-anchor="middle" class="title">Feedback coupling</text><text x="800" y="625" text-anchor="middle" class="small">cellular production / consumption fluxes → transport update → tissue fields</text>
</svg>
