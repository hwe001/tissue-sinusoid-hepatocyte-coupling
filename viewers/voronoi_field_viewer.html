<!doctype html><meta charset="utf-8"><title>Voronoi physiological fields</title>
<style>body{margin:0;background:#101820;color:#eef;font:14px system-ui}#ui{position:fixed;z-index:2;top:12px;left:12px;background:#182630ee;padding:12px;border-radius:7px}canvas{display:block}</style>
<div id="ui"><b>Virtual lobular physiological fields</b><br><select id="field"><option value="oxygen">Oxygen</option><option value="APAP">APAP</option><option value="NAPQI">NAPQI</option></select><br><small>drag rotate · wheel zoom · coloured lobules are SBML outputs</small></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js';
const s=new THREE.Scene();s.background=new THREE.Color(0x101820);const c=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100),r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);const o=new OrbitControls(c,r.domElement);s.add(new THREE.AmbientLight(0xffffff,1.8));let meshes=[];
Promise.all([fetch('true_3d_voronoi.json').then(x=>x.json()),fetch('voronoi_field_data.json').then(x=>x.json())]).then(([g,d])=>{const map=new Map(d.fields.map(x=>[x.id,x])),group=new THREE.Group();g.cells.filter(x=>map.has(x.id)&&Math.max(...x.center.map(Math.abs))<1.1).forEach(cell=>{const p=[];cell.faces.forEach(f=>{for(let k=1;k<f.length-1;k++)p.push(...cell.vertices[f[0]],...cell.vertices[f[k]],...cell.vertices[f[k+1]])});const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.Float32BufferAttribute(p,3));ge.computeVertexNormals();const m=new THREE.Mesh(ge,new THREE.MeshPhongMaterial({transparent:true,opacity:.78,side:THREE.DoubleSide}));m.userData=map.get(cell.id);group.add(m);meshes.push(m)});s.add(group);const b=new THREE.Box3().setFromObject(group),m=b.getCenter(new THREE.Vector3()),z=b.getSize(new THREE.Vector3()).length();o.target.copy(m);c.position.copy(m).add(new THREE.Vector3(z*.9,z*.7,z*.9));o.update();function color(){const f=document.querySelector('#field').value,v=meshes.map(x=>x.userData[f]),lo=Math.min(...v),hi=Math.max(...v);meshes.forEach(x=>{let q=(x.userData[f]-lo)/(hi-lo||1);x.material.color.setHSL(.66*(1-q),.8,.5)})}document.querySelector('#field').onchange=color;color()});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});(function a(){requestAnimationFrame(a);r.render(s,c)})();
</script>
